version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vj8OgnkNeswNszkN
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:vj8OgnkNeswNszkN@db:5432/postgres
      - SECRET_KEY=sb_secret_UYcCb4jkepvtnWFUP52OVA_e4QbcxY0
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GEMINI_API_KEY=AQ.Ab8RN6LtbM5rv4e4-IrcOJNuebFS4cAHUqnEXF0zAT71f4rLAA
    depends_on:
      - db

volumes:
  db_data:
